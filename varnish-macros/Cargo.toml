[package]
name = "varnish-macros"
authors = ["Yuri Astrakhan <YuriAstrakhan@gmail.com>", "Guillaume Quintard <guillaume.quintard@gmail.com>"]
description.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true

[lib]
proc-macro = true

[features]
default = ["full"]
# Mirrors `varnish/full`. The macro itself needs no `full`-only items, but the proc-macro is a
# host dependency, and with resolver 2 its `varnish-sys` features are resolved separately from
# the vmod's (target) `varnish-sys`. Keeping both feature sets identical lets cargo build
# `varnish-sys` (and its bindgen run) once instead of twice.
full = ["varnish-sys/full"]

[build-dependencies]
semver.workspace = true

[dependencies]
darling.workspace = true
glob.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
syn.workspace = true
# `full` is forwarded via this crate's own `full` feature, see [features] above.
varnish-sys = { workspace = true, default-features = false }

[dev-dependencies]
insta.workspace = true
regex.workspace = true

[lints]
workspace = true
