[package]
name = "vmod_echo_backend"
version = "0.0.0"
publish = false
edition.workspace = true

[dependencies]
# Pinned to `full`: uses the custom-backend API, which is gated out under the vrt-only surface.
# Without this pin, a workspace-wide `--no-default-features` build would break this example.
varnish = { workspace = true, features = ["full"] }

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true
