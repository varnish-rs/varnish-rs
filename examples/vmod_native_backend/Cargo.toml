[package]
name = "vmod_native_backend"
version = "0.0.0"
publish = false
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to `full`: uses the native-backend API, which is gated out under the vrt-only surface.
# Without this pin, a workspace-wide `--no-default-features` build would break this example.
varnish = { workspace = true, features = ["full"] }
varnish-sys = { workspace = true, features = ["full"] }

[lints]
workspace = true
