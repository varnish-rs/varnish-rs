[package]
name = "vmod_example"
version = "0.0.0"
publish = false
edition.workspace = true

[dependencies]
# Pinned to `full`: uses APIs (strings/etc.) not yet available under the vrt-only surface.
# Without this pin, a workspace-wide `--no-default-features` build would break this example.
varnish = { workspace = true, features = ["full"] }

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true
