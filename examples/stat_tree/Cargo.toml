[package]
name = "stat_tree"
version = "0.0.0"
publish = false
edition.workspace = true

[[bin]]
name = "stat_tree"
path = "src/main.rs"

[dependencies]
# Pinned to `full`: uses `MetricsReader`, which is gated out under the vrt-only surface.
# Without this pin, a workspace-wide `--no-default-features` build would break this example.
varnish = { workspace = true, features = ["full"] }
clap = { workspace = true }

[lints]
workspace = true
