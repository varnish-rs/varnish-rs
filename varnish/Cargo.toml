[package]
name = "varnish"
authors = ["Guillaume Quintard <guillaume.quintard@gmail.com>", "Yuri Astrakhan <YuriAstrakhan@gmail.com>"]
description.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = ["full"]
# Full ($ABI strict) API surface; see varnish-sys/Cargo.toml.
full = ["varnish-sys/full", "varnish-macros/full"]
# Raw `varnish_sys::ffi` passthrough only exposes the full struct layouts under `full`.
ffi = ["full"]

[dependencies]
glob.workspace = true
varnish-macros = { workspace = true, default-features = false }
varnish-sys = { workspace = true, default-features = false }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
